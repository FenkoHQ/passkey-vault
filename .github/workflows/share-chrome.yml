name: Share Chrome publishing credentials
on: workflow_dispatch
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install encryption library
        run: sudo apt-get install -y --no-install-recommends libsodium23
      - name: Encrypt for Slop Lens
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import base64, ctypes, json, os
          from pathlib import Path
          library = ctypes.CDLL('libsodium.so.23')
          assert library.sodium_init() >= 0
          key = base64.b64decode('fvLpA6/+Fk8znTkJ0A+QyY8dYE8sTaflS/Oj3VmRAHc=')
          sealed = {}
          for name in ('CHROME_CLIENT_ID', 'CHROME_CLIENT_SECRET', 'CHROME_REFRESH_TOKEN'):
              value = os.environ[name].encode()
              assert value, name + ' is missing'
              output = ctypes.create_string_buffer(len(value) + 48)
              assert library.crypto_box_seal(output, value, ctypes.c_ulonglong(len(value)), key) == 0
              sealed[name] = {'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(output.raw).decode()}
          Path('sealed-credentials.json').write_text(json.dumps(sealed))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slop-lens-sealed-credentials
          path: sealed-credentials.json
          retention-days: 1
