# XcodeGen spec. Generate the Xcode project on a Mac with:  xcodegen generate
# (brew install xcodegen). The .xcodeproj is intentionally NOT committed — it is
# generated from this declarative spec so the repo stays diff-friendly.
name: FenkoVault

options:
  bundleIdPrefix: nz.fenko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  postGenCommand: bash pin-packages.sh FenkoVault.xcodeproj

packages:
  VaultSync:
    path: Sync

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Override on the build machine / CI:  DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen ...
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  NativeUITestHost:
    type: application
    platform: iOS
    sources:
      - path: Tests/UITestHost
      - path: App
        excludes: [FenkoVaultApp.swift, FenkoVault.entitlements]
      - path: Shared
      - path: ../android/web/src/fonts/Saira.ttf
        buildPhase: resources
    dependencies:
      - package: VaultSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.fenko.vaultuitest
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCAL_DEVICE_TEST"
    scheme:
      testTargets: [NativeUITests]

  NativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/NativeUI
    dependencies:
      - target: NativeUITestHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NativeUITestHost

  WebMigrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/WebMigration
    dependencies:
      - target: FenkoVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FenkoVault.app/FenkoVault"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FenkoVault:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Migration/web
        type: folder
        buildPhase: resources
      - path: ../android/web/src/fonts/Saira.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.fenko.passkeyvault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FenkoVault.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: CredentialProvider
      - package: VaultSync

    scheme:
      testTargets:
        - WebMigrationTests

  CredentialProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: CredentialProvider
      - path: Shared
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.fenko.passkeyvault.CredentialProvider
        INFOPLIST_FILE: CredentialProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: CredentialProvider/CredentialProvider.entitlements
        GENERATE_INFOPLIST_FILE: NO
