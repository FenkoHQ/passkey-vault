<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passkey Vault</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-i18n-title="appName">
    <!-- Lock screen: shown when master password is set but vault is locked -->
    <div id="lock-screen" class="auth-screen" hidden>
      <div class="auth-hero">
        <div class="auth-hero-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <h1><span data-i18n="popupVaultLocked">Vault Locked</span></h1>
        <p class="auth-hint" data-i18n="popupUnlockHelp">Enter your master password to unlock.</p>
      </div>
      <div class="auth-form">
        <input
          type="password"
          id="unlock-password"
          placeholder="Master password"
          data-i18n-placeholder="popupMasterPasswordPlaceholder"
          autocomplete="off"
        />
        <div id="unlock-error" class="field-error" hidden></div>
        <button type="button" id="unlock-btn" class="btn btn-primary btn-full">
          <span data-i18n="popupUnlock">Unlock</span>
        </button>
      </div>
    </div>

    <!-- Setup screen: shown when no master password exists yet -->
    <div id="setup-screen" class="auth-screen" hidden>
      <div class="auth-hero">
        <div class="auth-hero-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <h1><span data-i18n="popupSetupVault">Set Up Vault</span></h1>
        <p class="auth-hint" data-i18n="popupSetupHelp">
          Create a master password to encrypt your passkeys at rest.
        </p>
      </div>
      <div class="auth-form">
        <input
          type="password"
          id="setup-password"
          placeholder="Master password (min 8 chars)"
          data-i18n-placeholder="popupSetupPasswordPlaceholder"
          autocomplete="off"
        />
        <input
          type="password"
          id="setup-password-confirm"
          placeholder="Confirm password"
          data-i18n-placeholder="popupConfirmPasswordPlaceholder"
          autocomplete="off"
        />
        <div id="setup-error" class="field-error" hidden></div>
        <button type="button" id="setup-btn" class="btn btn-primary btn-full">
          <span data-i18n="popupCreatePassword">Create Password</span>
        </button>
        <button type="button" id="skip-setup-btn" class="btn btn-ghost btn-full">
          <span data-i18n="popupSkipForNow">Skip for now</span>
        </button>
      </div>
    </div>

    <!-- Main container -->
    <div id="main-container" class="container" hidden>
      <header>
        <div class="header-content">
          <h1>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              shape-rendering="geometricPrecision"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <span>Passkey Vault</span>
          </h1>
          <button
            id="options-btn"
            class="icon-btn"
            type="button"
            title="Settings"
            data-i18n-title="popupOptionsTitle"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </header>

      <div class="status-row">
        <span class="badge" id="passkey-count">0 passkeys</span>
        <span id="sync-status-badge" class="badge muted" hidden></span>
      </div>

      <div class="search-container">
        <svg
          class="search-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search passkeys..."
          data-i18n-placeholder="popupSearchPlaceholder"
          autocomplete="off"
        />
        <button id="search-clear" type="button" class="search-clear" hidden>&times;</button>
      </div>

      <main>
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p data-i18n="popupLoadingPasskeys">Loading passkeys...</p>
        </div>

        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
          <h2 data-i18n="popupNoPasskeysYet">No Passkeys Yet</h2>
          <p data-i18n="popupNoPasskeysHelp">
            When you create a passkey on a website, it will be stored here automatically.
          </p>
          <button id="import-btn-empty" type="button" class="btn btn-secondary import-empty-btn">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span data-i18n="popupImportPasskeys">Import Passkeys</span>
          </button>
        </div>

        <div id="passkey-list" class="passkey-list" hidden>
          <!-- Passkeys injected here by popup.ts -->
        </div>
      </main>

      <footer>
        <div class="footer-row">
          <button
            id="refresh-btn"
            type="button"
            class="btn btn-icon"
            title="Refresh"
            data-i18n-title="commonRefresh"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
          <button
            id="export-full-btn"
            type="button"
            class="btn btn-primary"
            title="Backup"
            data-i18n-title="popupBackup"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span data-i18n="popupBackup">Backup</span>
          </button>
        </div>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
