name: iOS sync tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-sync:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: bash ios/test-sync.sh
      - name: Test native sync crypto
        run: |
          node ios/Sync/generate-words.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          SYNC_INTEROP_OUT="$RUNNER_TEMP/native-sync-event.json" bash ios/Sync/test-relay.sh
          node ios/Sync/verify-native.mjs "$RUNNER_TEMP/native-sync-event.json"
      - run: brew install xcodegen
      - name: Build app and credential provider without signing
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project FenkoVault.xcodeproj -scheme FenkoVault \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath "$RUNNER_TEMP/FenkoVault-simulator" \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Launch the native app in Simulator
        run: |
          device_id=$(xcrun simctl list devices available --json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const device = Object.values(JSON.parse(input).devices).flat()
                .find(device => device.name.startsWith("iPhone") && device.state === "Shutdown");
              if (!device) process.exit(1);
              process.stdout.write(device.udid);
            });
          ')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project ios/FenkoVault.xcodeproj -scheme FenkoVault \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath "$RUNNER_TEMP/FenkoVault-simulator" \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath "$RUNNER_TEMP/native-ios-tests.xcresult" \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 60 \
            CODE_SIGNING_ALLOWED=NO test
          xcrun simctl install "$device_id" \
            "$RUNNER_TEMP/FenkoVault-simulator/Build/Products/Debug-iphonesimulator/FenkoVault.app"
          xcrun simctl launch "$device_id" nz.fenko.passkeyvault
          sleep 3
          xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/native-vault.png"
          xcrun simctl shutdown "$device_id"
      - name: Save native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ios-tests
          path: ${{ runner.temp }}/native-ios-tests.xcresult
          retention-days: 7
      - name: Save the simulator screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ios-preview
          path: ${{ runner.temp }}/native-vault.png
          retention-days: 7
      - name: Archive for iOS without signing
        working-directory: ios
        run: |
          xcodebuild -project FenkoVault.xcodeproj -scheme FenkoVault \
            -onlyUsePackageVersionsFromResolvedFile \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FenkoVault.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Build the standalone device test app
        working-directory: ios
        run: |
          xcodegen generate --spec project-devsync.yml
          xcodebuild -project FenkoVaultSync.xcodeproj -scheme FenkoVaultSync \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
