name: Release Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 0.2.0). Publishes a draft release.'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/android-v}" ]; then
            echo "name=${GITHUB_REF#refs/tags/android-v}" >> "$GITHUB_OUTPUT"
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests
        run: npm test

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/signing/passkey-vault.jks

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./android/build-android.sh

      - name: Stage release asset
        run: |
          cp android/dist/passkey-vault-android-signed.apk \
            "android/dist/fenko-vault-${{ steps.ver.outputs.name }}.apk"

      - name: Publish GitHub Release
        if: steps.ver.outputs.tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/fenko-vault-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.name, '-') }}
          fail_on_unmatched_files: true

      - name: Upload APK artifact (manual runs)
        if: steps.ver.outputs.tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: fenko-vault-${{ steps.ver.outputs.name }}
          path: android/dist/fenko-vault-${{ steps.ver.outputs.name }}.apk
          if-no-files-found: error
