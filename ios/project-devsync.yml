# Native app testing with a free Apple account. Uses a separate encrypted vault
# and device-authenticated key. AutoFill requires the full paid-team target.
# Generate with:
#   DEVELOPMENT_TEAM=XXXX xcodegen generate --spec project-devsync.yml
name: FenkoVaultSync

options:
  bundleIdPrefix: nz.fenko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  FenkoVaultSync:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../android/web/src/fonts/Saira.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.fenko.vaultsync
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCAL_DEVICE_TEST"
        # No CODE_SIGN_ENTITLEMENTS — default dev entitlements sign on a free team.
