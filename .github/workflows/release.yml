name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege by default; jobs that need more elevate their own block.
permissions:
  contents: read

# Never run two releases for the same tag at once, and never cancel a publish
# that's mid-flight (a half-uploaded store submission is worse than waiting).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Version mismatch: git tag v${TAG} != package.json ${PKG}"
            echo "Run: npm run version:bump ${TAG}"
            exit 1
          fi
          echo "Version OK: ${PKG}"

      - name: Run tests
        run: npm run test

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Create Chrome ZIP
        run: |
          cd dist && zip -r ../passkey-vault-chrome.zip . && cd ..

      - name: Create Firefox ZIP
        run: |
          cd dist-firefox && zip -r ../passkey-vault-firefox.zip . && cd ..

      - name: Validate release ZIPs
        run: npm run validate:packages

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: passkey-vault-chrome
          path: dist/

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: passkey-vault-firefox
          path: dist-firefox/

      - name: Upload Chrome ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: passkey-vault-chrome-zip
          path: passkey-vault-chrome.zip

      - name: Upload Firefox ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: passkey-vault-firefox-zip
          path: passkey-vault-firefox.zip

  build-android:
    name: Build signed Android APK
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/signing/passkey-vault.jks

      - name: Build and sign APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          ./android/build-android.sh
          cp android/dist/passkey-vault-android-signed.apk \
            "android/dist/fenko-vault-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fenko-vault-apk
          path: android/dist/fenko-vault-*.apk
          if-no-files-found: error

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Chrome ZIP artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: passkey-vault-chrome-zip

      - name: Get OAuth access token
        id: token
        run: |
          TOKEN=$(curl -sf -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CHROME_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CHROME_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.CHROME_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token" | jq -r .access_token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Upload ZIP to Chrome Web Store
        run: |
          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/zip" \
            --data-binary @passkey-vault-chrome.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}?uploadType=media")
          echo "$RESPONSE" | jq .
          STATE=$(echo "$RESPONSE" | jq -r '.uploadState')
          if [ "$STATE" != "SUCCESS" ]; then
            echo "Upload failed with state: $STATE"
            echo "$RESPONSE" | jq '.itemError // empty'
            exit 1
          fi

      - name: Publish to Chrome Web Store
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}/publish")
          echo "$RESPONSE" | jq .
          STATUS=$(echo "$RESPONSE" | jq -r '.status[0] // empty')
          case "$STATUS" in
            OK)
              echo "Published to Chrome Web Store."
              ;;
            ITEM_PENDING_REVIEW)
              echo "Submitted to Chrome Web Store; pending review."
              ;;
            *)
              echo "Publish failed with status: $STATUS"
              exit 1
              ;;
          esac

  publish-firefox:
    name: Publish to Firefox Add-ons (AMO)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - name: Download Firefox build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: passkey-vault-firefox
          path: dist-firefox

      - name: Sign and submit to AMO (listed channel)
        run: |
          npx --yes web-ext@8 sign \
            --channel=listed \
            --source-dir=dist-firefox \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --timeout=900000

  publish-play:
    name: Publish to Google Play
    needs: build
    runs-on: ubuntu-latest
    # Keyless: no service-account key exists. GitHub's OIDC token is federated
    # into GCP (Workload Identity) and impersonates the Play publisher SA for a
    # short-lived token. Gated on the WIF provider being configured as a repo
    # variable, so the job is a clean skip until that's set — the rest of the
    # release (Chrome, Firefox, GitHub Release) is never affected.
    if: ${{ vars.PLAY_WIF_PROVIDER != '' }}
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for WIF

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2; exit 1; }
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/signing/passkey-vault.jks

      - name: Compute versionCode
        id: vc
        run: |
          # Monotonic and always > the last manual upload (902).
          VC=$(( 1000 + ${{ github.run_number }} ))
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Using versionCode $VC"

      - name: Build signed AAB
        env:
          # VERSION_NAME defaults to package.json, which the build job already
          # verified equals the tag.
          VERSION_CODE: ${{ steps.vc.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./android/build-aab.sh

      - name: Resolve AAB path
        id: aab
        run: echo "path=$(ls android/dist/fenko-vault-*.aab | head -1)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (keyless, WIF)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload AAB to Google Play (production)
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PKG: nz.fenko.passkeyvault
          AAB: ${{ steps.aab.outputs.path }}
        run: |
          set -euo pipefail
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG"
          UPLOAD="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PKG"
          auth=(-H "Authorization: Bearer $TOKEN")

          echo "→ Creating edit"
          EDIT_ID=$(curl -sf -X POST "$API/edits" "${auth[@]}" -H "Content-Length: 0" | jq -r .id)
          echo "  editId=$EDIT_ID"

          echo "→ Uploading $AAB"
          VC=$(curl -sf -X POST "$UPLOAD/edits/$EDIT_ID/bundles?uploadType=media" "${auth[@]}" \
            -H "Content-Type: application/octet-stream" --data-binary @"$AAB" | jq -r .versionCode)
          echo "  uploaded versionCode=$VC"

          echo "→ Assigning versionCode $VC to production (full rollout)"
          PAYLOAD=$(jq -n --arg vc "$VC" --rawfile notes android/play/whatsnew/whatsnew-en-US '
            { track: "production",
              releases: [ { versionCodes: [$vc], status: "completed",
                            releaseNotes: [ { language: "en-US", text: $notes } ] } ] }')
          curl -sf -X PUT "$API/edits/$EDIT_ID/tracks/production" "${auth[@]}" \
            -H "Content-Type: application/json" -d "$PAYLOAD" | jq -r '.releases[0]'

          echo "→ Committing edit"
          curl -sf -X POST "$API/edits/$EDIT_ID:commit" "${auth[@]}" -H "Content-Length: 0" | jq -r '.id'
          echo "✅ Published versionCode $VC to production."

  release:
    name: Create Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download Chrome ZIP artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: passkey-vault-chrome-zip

      - name: Download Firefox ZIP artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: passkey-vault-firefox-zip

      - name: Download Android APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fenko-vault-apk

      - name: Extract tag name
        id: tag_name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Prepare release notes
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          # Pull this version's section out of CHANGELOG.md (between its
          # "## [VER]" heading and the next "## [" heading).
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { p = 1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          {
            echo ""
            echo "---"
            echo ""
            echo "## Installation"
            echo ""
            echo "### Chrome"
            echo "1. Download \`passkey-vault-chrome.zip\` and extract it"
            echo "2. Open \`chrome://extensions/\`, enable Developer mode"
            echo "3. Click \"Load unpacked\" and select the extracted directory"
            echo ""
            echo "### Firefox"
            echo "1. Download \`passkey-vault-firefox.zip\` and extract it"
            echo "2. Open \`about:debugging#/runtime/this-firefox\`"
            echo "3. Click \"Load Temporary Add-on...\" and select \`manifest.json\`"
            echo ""
            echo "### Android"
            echo "1. Download \`fenko-vault-${VER}.apk\`"
            echo "2. Allow installs from unknown sources, then open the APK to install"
            echo "3. Enable Fenko Vault under Settings → Passwords & accounts → passkey provider"
            echo ""
            echo "See the [full changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          } >> RELEASE_NOTES.md
          echo "---- release notes ----"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Passkey Vault ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag_name.outputs.tag, 'alpha') || contains(steps.tag_name.outputs.tag, 'beta') || contains(steps.tag_name.outputs.tag, 'rc') }}
          files: |
            passkey-vault-chrome.zip
            passkey-vault-firefox.zip
            fenko-vault-*.apk
          body_path: RELEASE_NOTES.md
