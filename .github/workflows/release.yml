name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Version mismatch: git tag v${TAG} != package.json ${PKG}"
            echo "Run: npm run version:bump ${TAG}"
            exit 1
          fi
          echo "Version OK: ${PKG}"

      - name: Run tests
        run: npm run test

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Create Chrome ZIP
        run: |
          cd dist && zip -r ../passkey-vault-chrome.zip . && cd ..

      - name: Create Firefox ZIP
        run: |
          cd dist-firefox && zip -r ../passkey-vault-firefox.zip . && cd ..

      - name: Validate release ZIPs
        run: npm run validate:packages

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: passkey-vault-chrome
          path: dist/

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: passkey-vault-firefox
          path: dist-firefox/

      - name: Upload Chrome ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: passkey-vault-chrome-zip
          path: passkey-vault-chrome.zip

      - name: Upload Firefox ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: passkey-vault-firefox-zip
          path: passkey-vault-firefox.zip

  build-android:
    name: Build signed Android APK
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/signing/passkey-vault.jks

      - name: Build and sign APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          ./android/build-android.sh
          cp android/dist/passkey-vault-android-signed.apk \
            "android/dist/fenko-vault-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenko-vault-apk
          path: android/dist/fenko-vault-*.apk
          if-no-files-found: error

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Chrome ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: passkey-vault-chrome-zip

      - name: Get OAuth access token
        id: token
        run: |
          TOKEN=$(curl -sf -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CHROME_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CHROME_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.CHROME_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token" | jq -r .access_token)
          echo "access_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Upload ZIP to Chrome Web Store
        run: |
          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/zip" \
            --data-binary @passkey-vault-chrome.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}?uploadType=media")
          echo "$RESPONSE" | jq .
          STATE=$(echo "$RESPONSE" | jq -r '.uploadState')
          if [ "$STATE" != "SUCCESS" ]; then
            echo "Upload failed with state: $STATE"
            echo "$RESPONSE" | jq '.itemError // empty'
            exit 1
          fi

      - name: Publish to Chrome Web Store
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}/publish")
          echo "$RESPONSE" | jq .
          STATUS=$(echo "$RESPONSE" | jq -r '.status[0] // empty')
          if [ "$STATUS" != "OK" ]; then
            echo "Publish failed with status: $STATUS"
            exit 1
          fi

  publish-firefox:
    name: Publish to Firefox Add-ons (AMO)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download Firefox build artifact
        uses: actions/download-artifact@v4
        with:
          name: passkey-vault-firefox
          path: dist-firefox

      - name: Sign and submit to AMO (listed channel)
        run: |
          npx --yes web-ext@8 sign \
            --channel=listed \
            --source-dir=dist-firefox \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --timeout=900000

  release:
    name: Create Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Chrome ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: passkey-vault-chrome-zip

      - name: Download Firefox ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: passkey-vault-firefox-zip

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: fenko-vault-apk

      - name: Extract tag name
        id: tag_name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Prepare release notes
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          # Pull this version's section out of CHANGELOG.md (between its
          # "## [VER]" heading and the next "## [" heading).
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { p = 1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          {
            echo ""
            echo "---"
            echo ""
            echo "## Installation"
            echo ""
            echo "### Chrome"
            echo "1. Download \`passkey-vault-chrome.zip\` and extract it"
            echo "2. Open \`chrome://extensions/\`, enable Developer mode"
            echo "3. Click \"Load unpacked\" and select the extracted directory"
            echo ""
            echo "### Firefox"
            echo "1. Download \`passkey-vault-firefox.zip\` and extract it"
            echo "2. Open \`about:debugging#/runtime/this-firefox\`"
            echo "3. Click \"Load Temporary Add-on...\" and select \`manifest.json\`"
            echo ""
            echo "### Android"
            echo "1. Download \`fenko-vault-${VER}.apk\`"
            echo "2. Allow installs from unknown sources, then open the APK to install"
            echo "3. Enable Fenko Vault under Settings → Passwords & accounts → passkey provider"
            echo ""
            echo "See the [full changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          } >> RELEASE_NOTES.md
          echo "---- release notes ----"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Passkey Vault ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag_name.outputs.tag, 'alpha') || contains(steps.tag_name.outputs.tag, 'beta') || contains(steps.tag_name.outputs.tag, 'rc') }}
          files: |
            passkey-vault-chrome.zip
            passkey-vault-firefox.zip
            fenko-vault-*.apk
          body_path: RELEASE_NOTES.md
